<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipick ERD</title>
<style>
:root {
  --bg: #eef2ee;
  --grid: rgba(120, 140, 125, .16);
  --ink: #1d2320;
  --muted: #5d6a63;
  --line: #3b4540;
  --card: #ffffff;
  --card-line: #6f7a74;
  --group-line: rgba(80, 100, 88, .45);
  --c-member: #f3e4a6; --c-order: #dcdcd8; --c-payment: #f2c3cb; --c-point: #f2c9b9;
  --c-product: #d2ccf3; --c-mart: #b9e2ef; --c-recipe: #c9e9ca; --c-auto: #c3e7d3;
  --c-ai: #f7d3a3; --c-billing: #f2c3cb;
  --new: #d6381f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171c19; --grid: rgba(190, 210, 195, .07); --ink: #e9efeb; --muted: #9baba2;
    --line: #8fa097; --card: #222a26; --card-line: #6c7a72; --group-line: rgba(180, 200, 188, .35);
    --c-member: #5d5428; --c-order: #46484a; --c-payment: #62343c; --c-point: #62402f;
    --c-product: #403a68; --c-mart: #284f5e; --c-recipe: #335a37; --c-auto: #2f5a45;
    --c-ai: #6a4a22; --c-billing: #62343c; --new: #ff7a63;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
}
#canvas { position: relative; padding: 56px 56px 56px; width: max-content; min-width: 100%; }
#lines { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
#lines path { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-linejoin: miter; opacity: .72; transition: opacity .15s; }
#lines.dim path { opacity: .08; }
#lines.dim path.hit { opacity: 1; stroke-width: 1.8; }
body.no-lines #lines { display: none; }
.rows { display: grid; gap: 28px; }
.row1 { grid-template-columns: repeat(7, 304px); gap: 28px 104px; align-items: start; }
.group {
  border: 1.5px dashed var(--group-line); border-radius: 14px; padding: 36px 12px 6px; position: relative;
  background: rgba(255, 255, 255, .22);
}
@media (prefers-color-scheme: dark) { .group { background: rgba(255, 255, 255, .03); } }
.group-title { position: absolute; left: 14px; top: 10px; font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
.row2 .group { width: max-content; }
.row2 .tables { display: flex; flex-wrap: wrap; gap: 0 84px; align-items: flex-start; }
.row2 .table { width: 350px; }
.table {
  position: relative; z-index: 1; background: var(--card); border: 1.4px solid var(--card-line);
  border-radius: 9px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 1px 0 rgba(0, 0, 0, .06);
}
.thead { padding: 7px 10px; font-weight: 800; font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.badge { font-size: 10px; font-weight: 700; color: var(--new); display: none; align-self: center; }
body.show-changes .table.is-new .badge { display: inline; }
.col, .idx { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 6px; padding: 2px 10px; font-size: 11px; line-height: 1.55; }
.col .k { color: var(--muted); font-size: 9.5px; font-weight: 700; align-self: center; letter-spacing: .02em; }
.col .n { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; overflow-wrap: anywhere; }
.col .t { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; color: var(--muted); text-align: right; font-size: 10.5px; white-space: nowrap; }
.idx { color: var(--muted); border-top: 1px dashed var(--card-line); grid-template-columns: 42px minmax(0, 1fr); }
.idx + .idx { border-top: 0; }
.idx .n { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; }
body.show-changes .col.is-new .n { color: var(--new); font-weight: 700; }
body.show-changes .col.is-new { background: rgba(214, 56, 31, .09); }
.g-member .thead { background: var(--c-member); } .g-order .thead { background: var(--c-order); }
.g-payment .thead { background: var(--c-payment); } .g-point .thead { background: var(--c-point); }
.g-product .thead { background: var(--c-product); } .g-recipe .thead { background: var(--c-recipe); }
.g-auto .thead { background: var(--c-auto); } .g-billing .thead { background: var(--c-billing); }
.table[data-name="MART"] .thead { background: var(--c-mart); }
.table[data-name="AI_REQUEST_LOG"] .thead { background: var(--c-ai); }
#tools {
  position: fixed; right: 14px; top: 12px; z-index: 5; display: flex; gap: 14px; align-items: center;
  background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 7px 12px;
  font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
}
#tools label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
#tools .hint { color: var(--muted); }
body.capture #tools { display: none; }
</style>
</head>
<body class="show-lines">
<div id="tools">
  <label><input type="checkbox" id="t-lines" checked> 관계선</label>
  <label><input type="checkbox" id="t-changes"> 변경 표시</label>
  <span class="hint">H 키: 도구 숨기기/보이기</span>
</div>
<div id="canvas">
  <svg id="lines"></svg>
  <div class="rows row1" id="row1"></div>
  <div class="rows row2" id="row2" style="margin-top:90px"></div>
</div>

}

function render() {
  DATA.groups.forEach((g, gi) => {
    const group = el('section', 'group g-' + g.color);
    group.appendChild(el('div', 'group-title', g.title));
    const wrap = el('div', 'tables');
    g.tables.forEach(t => {
      const table = el('div', 'table' + (t.isNew ? ' is-new' : ''));
      table.dataset.name = t.name;
      const head = el('div', 'thead');
      const name = el('span', '', t.name);
      if (t.comment) name.title = t.comment;
      head.appendChild(name);
      head.appendChild(el('span', 'badge', '신규'));
      table.appendChild(head);
      t.cols.forEach(c => {
        const row = el('div', 'col' + (t.newCols.includes(c.name) ? ' is-new' : ''));
        row.dataset.col = t.name + '.' + c.name;
        if (c.note) row.title = c.note;
        row.appendChild(el('span', 'k', c.key));
        row.appendChild(el('span', 'n', c.name));
        row.appendChild(el('span', 't', c.type));
        table.appendChild(row);
      });
      t.idx.forEach(cols => {
        const row = el('div', 'idx');
        row.appendChild(el('span', 'k', 'IDX'));
        row.appendChild(el('span', 'n', 'INDEX(' + cols + ')'));
        table.appendChild(row);
      });
      table.addEventListener('mouseenter', () => focusTable(t.name));
      table.addEventListener('mouseleave', () => focusTable(null));
      wrap.appendChild(table);
    });
    group.appendChild(wrap);
    document.getElementById(gi < 7 ? 'row1' : 'row2').appendChild(group);
  });

function anchor(colEl, tableEl, side, canvasRect) {

  const t = tableEl.getBoundingClientRect();
  return {
    x: (side > 0 ? t.right : t.left) - canvasRect.left,
    y: r.top + r.height / 2 - canvasRect.top,
  };
}

function foot(d, x, y, dir, many) {
  // dir: 선이 테이블 밖으로 나가는 방향(+1 오른쪽, -1 왼쪽)
  if (many) {
    d.push(`M${x + dir * 11},${y} L${x},${y - 5} M${x + dir * 11},${y} L${x},${y} M${x + dir * 11},${y} L${x},${y + 5}`);

// ---- 직각 배선: 표를 장애물로 두고 꺾임·겹침·교차에 비용을 주는 A* 로 경로를 찾는다 ----
const CELL = 5;
const BEND = 6, OVERLAP = 14, CROSS = 2, NEAR = 3;
const DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];

class MinHeap {
  constructor() { this.f = []; this.v = []; }
  get size() { return this.f.length; }
  push(f, v) {
    const F = this.f, V = this.v;
    let i = F.length;
    F.push(f); V.push(v);
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (F[p] <= F[i]) break;
      [F[p], F[i]] = [F[i], F[p]]; [V[p], V[i]] = [V[i], V[p]];
      i = p;
    }
  }
  pop() {
    const F = this.f, V = this.v;
    const top = V[0];
    const lf = F.pop(), lv = V.pop();
    if (F.length) {
      F[0] = lf; V[0] = lv;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1;
        let m = i;
        if (l < F.length && F[l] < F[m]) m = l;
        if (r < F.length && F[r] < F[m]) m = r;
        if (m === i) break;
        [F[m], F[i]] = [F[i], F[m]]; [V[m], V[i]] = [V[i], V[m]];
        i = m;
      }
    }
    return top;
  }
}

function makeRouter(width, height, blocked) {
  const W = width, H = height;
  const hUse = new Uint8Array(W * H), vUse = new Uint8Array(W * H);
  // 이미 놓인 선 바로 옆 칸: 선끼리 한 칸쯤 띄워 놓도록 약한 비용을 준다
  const hNear = new Uint8Array(W * H), vNear = new Uint8Array(W * H);
  const g = new Float32Array(W * H * 4), parent = new Int32Array(W * H * 4);
  return function route(sx, sy, sdir, ex, ey) {
    g.fill(Infinity); parent.fill(-1);
    const heap = new MinHeap();
    const start = (sy * W + sx) * 4 + sdir;
    g[start] = 0;
    heap.push(Math.abs(sx - ex) + Math.abs(sy - ey), start);
    let goal = -1;
    while (heap.size) {
      const cur = heap.pop();
      const d = cur & 3, cell = cur >> 2;
      const x = cell % W, y = (cell / W) | 0;
      if (x === ex && y === ey) { goal = cur; break; }
      const base = g[cur];
      for (let nd = 0; nd < 4; nd++) {
        if ((nd ^ 1) === d) continue; // 되돌아가기 금지
        const nx = x + DX[nd], ny = y + DY[nd];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const ncell = ny * W + nx;
        if (blocked[ncell] && !(nx === ex && ny === ey)) continue;
        const horizontal = nd < 2;
        let cost = 1 + (nd !== d ? BEND : 0);
        cost += horizontal
          ? hUse[ncell] * OVERLAP + vUse[ncell] * CROSS + (hNear[ncell] ? NEAR : 0)
          : vUse[ncell] * OVERLAP + hUse[ncell] * CROSS + (vNear[ncell] ? NEAR : 0);
        const ng = base + cost;
        const nstate = ncell * 4 + nd;
        if (ng < g[nstate]) {
          g[nstate] = ng; parent[nstate] = cur;
          heap.push(ng + Math.abs(nx - ex) + Math.abs(ny - ey), nstate);
        }
      }
    }
    if (goal < 0) return null;
    const cells = [];
    for (let s = goal; s !== -1; s = parent[s]) cells.push([(s >> 2) % W, ((s >> 2) / W) | 0]);
    cells.reverse();
    for (let i = 1; i < cells.length; i++) {
      const [x0, y0] = cells[i - 1], [x1, y1] = cells[i];
      const a = y0 * W + x0, b = y1 * W + x1;
      if (y0 === y1) {
        hUse[a] = Math.min(255, hUse[a] + 1); hUse[b] = Math.min(255, hUse[b] + 1);
        for (const dy of [-1, 1]) {
          if (y0 + dy >= 0 && y0 + dy < H) { hNear[a + dy * W] = 1; hNear[b + dy * W] = 1; }
        }
      } else {
        vUse[a] = Math.min(255, vUse[a] + 1); vUse[b] = Math.min(255, vUse[b] + 1);
        for (const dx of [-1, 1]) {
          if (x0 + dx >= 0 && x0 + dx < W) { vNear[a + dx] = 1; vNear[b + dx] = 1; }
        }
      }
    }
    return cells;
  };
}

function corners(cells) {
  const out = [cells[0]];
  for (let i = 1; i < cells.length - 1; i++) {
    const a = cells[i - 1], b = cells[i], c = cells[i + 1];
    if ((b[0] - a[0]) !== (c[0] - b[0]) || (b[1] - a[1]) !== (c[1] - b[1])) out.push(b);
  }
  out.push(cells[cells.length - 1]);
  return out;
}

function drawLines() {
  const svg = document.getElementById('lines');
  const canvas = document.getElementById('canvas');
  const cr = canvas.getBoundingClientRect();
  const pxW = canvas.scrollWidth, pxH = canvas.scrollHeight;
  svg.setAttribute('width', pxW);
  svg.setAttribute('height', pxH);
  svg.innerHTML = '';

  const W = Math.ceil(pxW / CELL) + 4, H = Math.ceil(pxH / CELL) + 4;
  const blocked = new Uint8Array(W * H);
  document.querySelectorAll('.table, .group-title').forEach(t => {
    const r = t.getBoundingClientRect();
    const x0 = Math.floor((r.left - cr.left) / CELL) - 1, x1 = Math.ceil((r.right - cr.left) / CELL);
    const y0 = Math.floor((r.top - cr.top) / CELL) - 1, y1 = Math.ceil((r.bottom - cr.top) / CELL);
    for (let y = Math.max(0, y0); y <= Math.min(H - 1, y1); y++) {
      for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++) blocked[y * W + x] = 1;
    }
  });
  const route = makeRouter(W, H, blocked);

  const jobs = [];
  DATA.refs.forEach(ref => {
    const fkEl = document.querySelector(`[data-col="${ref.fk}"]`);
    const pkEl = document.querySelector(`[data-col="${ref.pk}"]`);
    if (!fkEl || !pkEl) return;
    const fkTable = fkEl.closest('.table'), pkTable = pkEl.closest('.table');
    const fr = fkTable.getBoundingClientRect(), pr = pkTable.getBoundingClientRect();
    const fc = (fr.left + fr.right) / 2, pc = (pr.left + pr.right) / 2;
    const sameColumn = Math.abs(fc - pc) < 40;
    const gutterSide = fc > cr.left + pxW * 0.6 ? -1 : 1;
    const fkSide = sameColumn ? gutterSide : (pc > fc ? 1 : -1);
    const pkSide = sameColumn ? gutterSide : -fkSide;
    const a = anchor(fkEl, fkTable, fkSide, cr);
    const b = anchor(pkEl, pkTable, pkSide, cr);
    jobs.push({ ref, fkTable, pkTable, fkSide, pkSide, a, b, dist: Math.abs(a.x - b.x) + Math.abs(a.y - b.y) });
  });
  jobs.sort((p, q) => p.dist - q.dist); // 가까운 연결부터 놓고 먼 연결이 돌아가게 한다

  const stubCell = (x, side) => side > 0 ? Math.ceil(x / CELL) + 1 : Math.floor(x / CELL) - 2;
  jobs.forEach(job => {
    const { ref, fkTable, pkTable, fkSide, pkSide, a, b } = job;
    const s = [stubCell(a.x, fkSide), Math.round(a.y / CELL)];
    const e = [stubCell(b.x, pkSide), Math.round(b.y / CELL)];
    const cells = route(s[0], s[1], fkSide > 0 ? 0 : 1, e[0], e[1]);
    let pts;
    if (cells) {
      const cs = corners(cells);
      pts = cs.map(c => ({ x: c[0] * CELL + CELL / 2, y: c[1] * CELL + CELL / 2, cx: c[0], cy: c[1] }));
      // 표 옆 가로 구간은 컬럼 행의 정확한 높이에 맞춘다
      for (let i = 0; i < pts.length && pts[i].cy === s[1]; i++) pts[i].y = a.y;
      for (let i = pts.length - 1; i >= 0 && pts[i].cy === e[1]; i--) pts[i].y = b.y;
    } else {
      const mx = (a.x + b.x) / 2;
      pts = [{ x: a.x + fkSide * 10, y: a.y }, { x: mx, y: a.y }, { x: mx, y: b.y }, { x: b.x + pkSide * 10, y: b.y }];
    }
    const all = [{ x: a.x, y: a.y }, ...pts, { x: b.x, y: b.y }];
    const d = [all.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')];
    foot(d, a.x, a.y, fkSide, ref.rel === 'many');
    foot(d, b.x, b.y, pkSide, false);
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d.join(' '));
    p.dataset.tables = fkTable.dataset.name + ',' + pkTable.dataset.name;
    svg.appendChild(p);
  });
}

function focusTable(name) {
  const svg = document.getElementById('lines');
  svg.classList.toggle('dim', !!name);
  svg.querySelectorAll('path').forEach(p => {
    p.classList.toggle('hit', !!name && p.dataset.tables.split(',').includes(name));
  });
}

document.getElementById('t-lines').addEventListener('change', e => {
  document.body.classList.toggle('no-lines', !e.target.checked);
});
document.getElementById('t-changes').addEventListener('change', e => {
  document.body.classList.toggle('show-changes', e.target.checked);
});
document.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('capture');
});

// ?capture 로 열면 도구 막대 없이, ?changes 를 붙이면 변경 표시를 켠 채로 열린다
if (/[?&]capture/.test(location.search)) document.body.classList.add('capture');
if (/[?&]changes/.test(location.search)) {
  document.body.classList.add('show-changes');
  document.getElementById('t-changes').checked = true;
}

render();
let redrawTimer = null;
const redraw = () => {
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(() => {
    const t0 = performance.now();
    drawLines();
    const canvas = document.getElementById('canvas');
    document.documentElement.dataset.size = canvas.scrollWidth + 'x' + canvas.scrollHeight;
    document.documentElement.dataset.routed = Math.round(performance.now() - t0) + 'ms';
  }, 80);
};
window.addEventListener('load', redraw);
window.addEventListener('resize', redraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
redraw();
</script>
