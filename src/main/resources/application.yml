spring:
  application:
    name: recipick
  profiles:
    default: local
  autoconfigure:
    # JWT 인증을 직접 구현하므로 기본 사용자(임시 비밀번호) 생성을 끈다
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

security:
  trial-block:
    secret: ${TRIAL_BLOCK_HMAC_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  login:
    max-failures: 3
    failure-expiration: 10m
    lock-duration: 10m
    refresh-cookie-secure: true

ai:
  # API 키를 받기 전에는 가짜 응답(fake)으로 개발하고, 키를 넣은 환경에서만 claude로 바꾼다
  client: ${AI_CLIENT:fake}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}

management:
  server:
    # 헬스 체크·지표는 앱 포트와 분리한 관리 포트에서만 연다. 이 포트는 외부(인터넷)에 공개하지 않는다
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

recipick:
  rate-limit:
    # 부하 테스트(k6)는 한 IP에서 많이 보내므로 RATE_LIMIT_ENABLED=false로 끄고 돌린다
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: 1m
    auth-limit: 10
    api-limit: 120
---
spring:
  config:
    activate:
      on-profile: local
security:
  login:
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}

---
spring:
  config:
    activate:
      on-profile: "(local | test) & !prod & !production"
  sql:
    init:
      data-locations:
        - classpath:data.sql
        - classpath:data-admin-local.sql
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    # 운영은 로그를 수집·검색하기 쉽게 JSON으로 남긴다(MDC의 traceId가 함께 출력된다)
    format:
      console: logstash

---
# 레시피 초기 데이터는 시연 화면용이라 로컬에서만 넣는다. 테스트에 넣으면 레시피 검색 결과 건수가 달라져 기존 테스트가 흔들린다.
# 목록 값은 문서끼리 합쳐지지 않고 마지막 문서 값으로 덮이므로, 위 SQL 두 개를 다시 적는다.
spring:
  config:
    activate:
      on-profile: "local & !test & !prod & !production"
  sql:
    init:
      data-locations:
        - classpath:data.sql
        - classpath:data-admin-local.sql
        - optional:classpath:data-recipe-local.sql
