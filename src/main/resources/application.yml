spring:
  application:
    name: recipick
  profiles:
    default: local
  autoconfigure:
    # JWT 인증을 직접 구현하므로 기본 사용자(임시 비밀번호) 생성을 끈다
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      # Redis가 응답하지 않아도 요청 스레드가 기본값(약 60초) 동안 묶이지 않게 한다
      timeout: 500ms
      connect-timeout: 1s

security:
  trial-block:
    secret: ${TRIAL_BLOCK_HMAC_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  login:
    max-failures: 3
    failure-expiration: 10m
    lock-duration: 10m
    refresh-cookie-secure: true

ai:
  # API 키를 받기 전에는 가짜 응답(fake)으로 개발
  client: ${AI_CLIENT:fake}
  claude:
    api-key: ${ANTHROPIC_API_KEY:}

management:
  server:
    # 헬스 체크·지표는 앱 포트와 분리한 관리 포트에서만 연다. 이 포트는 외부(인터넷)에 공개하지 않는다
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

recipick:
  rate-limit:
    # 부하 테스트(k6)는 한 IP에서 많이 보내므로 RATE_LIMIT_ENABLED=false로 끄고 돌린다
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: 1m
    auth-limit: 10
    api-limit: 120
  billing-key:
    # 카드 등록 API 스위치. 운영 기본 false — 테스트 채널 환경에서만 BILLING_KEY_REGISTRATION_ENABLED=true로 켠다.
    # 실채널 차단은 이 값과 무관하게 코드가 한다(docs/api/billing-key-registration.md)
    registration-enabled: ${BILLING_KEY_REGISTRATION_ENABLED:false}
  membership-billing:
    # 멤버십 자동결제 신규 청구 스위치. 운영 기본 false
    # 꺼져 있어도 이미 생긴 결제의 재조회·결과 반영·복구·갱신 회차 정리는 계속 돈다(docs/api/membership-first-charge.md,
    # docs/api/membership-renewal.md). 갱신 재시도 간격(retry-interval 24h)·회차당 PG 발송 한도(renewal-max-dispatches 3)는
    # 정책값이라 기본값 그대로 두며 다른 값을 넣으면 기동이 멈춘다
    enabled: ${MEMBERSHIP_BILLING_ENABLED:false}

payment:
  billing-key-deletion:
    # 교체·폐기 빌링키의 PortOne 원격 정리(5분 스캔 접수·1분 복구 실행) 스위치. 운영 기본 false(docs/api/billing-key-cleanup.md)
    enabled: ${BILLING_KEY_DELETION_ENABLED:false}
    # 회원 탈퇴의 AUTO_BILLING 정산 영역 제공 + 탈퇴 준비(ACTIVE 키 정리 접수) 연결 스위치. enabled와 함께 true일 때만 켜진다.
    # 회원 탈퇴 연동 검증이 끝나기 전에는 false — 꺼져 있으면 탈퇴는 기존대로 MEMBER-008로 닫혀 있다
    withdrawal-enabled: ${BILLING_KEY_DELETION_WITHDRAWAL_ENABLED:false}
    # 삭제 전용 HTTP 읽기 제한. 삭제 조회·DELETE는 지연 큐 밖(전용 스케줄러)에서만 돈다
    read-timeout: 60s
---
spring:
  config:
    activate:
      on-profile: local
security:
  login:
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:false}

---
spring:
  config:
    activate:
      on-profile: "(local | test) & !prod & !production"
  sql:
    init:
      data-locations:
        - classpath:data.sql
        - classpath:data-admin-local.sql
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    # 운영은 로그를 수집·검색하기 쉽게 JSON으로 남긴다(MDC의 traceId가 함께 출력된다)
    format:
      console: logstash

---
# 레시피 초기 데이터는 시연 화면용이라 로컬에서만 넣는다. 테스트에 넣으면 레시피 검색 결과 건수가 달라져 기존 테스트가 흔들린다.
# 목록 값은 문서끼리 합쳐지지 않고 마지막 문서 값으로 덮이므로, 위 SQL 두 개를 다시 적는다.
spring:
  config:
    activate:
      on-profile: "local & !test & !prod & !production"
  sql:
    init:
      data-locations:
        - classpath:data.sql
        - classpath:data-admin-local.sql
        - optional:classpath:data-recipe-local.sql
        - optional:classpath:data-product-local.sql
