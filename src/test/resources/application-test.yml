# 조회 캐시는 끈 채로 테스트한다. 캐시 동작은 CacheIntegrationTest만 켜서 확인한다
recipick:
  cache:
    enabled: false
  rate-limit:
    enabled: false
  # 테스트는 PortOne 더미 설정(테스트 채널 키)이라 카드 등록 API를 연다. 닫힌 동작은 BillingKeyRegistrationDisabledApiTest가 본다
  billing-key:
    registration-enabled: true
  # 첫 결제 접수·실행 테스트는 플래그를 연다. 닫힌 동작은 토글 gate로 테스트 안에서 재현한다
  membership-billing:
    enabled: true

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

# 테스트는 실제 AI를 부르지 않는다. AI 응답을 바꿔야 하는 테스트는 @MockitoBean AiClient를 쓴다
ai:
  client: fake

# PortOne 설정 바인딩용 더미 값. 테스트는 외부 호출을 하지 않는다
portone:
  api-secret: test-secret
  base-url: http://localhost:0
  connect-timeout: 1s
  read-timeout: 1s
  store-id: test-store-id
  channel-key: test-channel-key
  # Standard Webhooks 공개 예제 키(실제 키 아님). 서명 검증 테스트가 같은 값을 쓴다
  webhook:
    secret: MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
