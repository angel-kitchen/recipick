# 앱과 리버스 프록시. 배포 스크립트는 이 파일만 다룬다(docker compose up -d 는 이 파일만 읽는다).
# 서버 배치: /opt/recipick/{compose*.yml, .env, nginx/, certbot/}. 처음 한 번 `docker network create recipick`.
# 재시작 방식 배포: IMAGE_TAG를 .env에 쓰고 `docker compose up -d --no-deps app`. nginx는 업스트림 DNS를 다시 조회하므로 reload가 필요 없다.
name: recipick-app

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: recipick-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 디렉터리째 마운트해 이미지의 default.conf를 가린다. 블루그린 전환은 호스트에서 upstream.conf를 고치고 reload
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    logging: *logging

  app:
    image: ${IMAGE}:${IMAGE_TAG}
    container_name: recipick-app
    restart: unless-stopped
    # 앱 포트는 호스트에 노출하지 않는다. nginx만 recipick 네트워크로 접근한다
    expose:
      - "8080"
    # 앱에 필요한 값만 넘긴다(.env의 MySQL 루트 비밀번호 등은 넘기지 않는다)
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY:-}
    healthcheck:
      # 관리 포트가 UP이어도 앱 포트가 요청을 받는다는 보장은 없어(docs/monitoring.md) 둘을 함께 본다
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health && curl -fsS http://localhost:8080/api/categories"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits:
          # 힙은 이 값의 75%(Dockerfile의 JAVA_TOOL_OPTIONS). 블루그린 교체 순간 둘이 떠도 4GB 안에 들어오는 크기
          memory: 1280m
    logging: *logging

  # 인증서 발급·갱신용. 기본으로는 뜨지 않는다(--profile certbot).
  # 발급: docker compose --profile certbot run --rm certbot certonly --webroot -w /var/www/certbot -d <도메인> --email <메일> --agree-tos
  #       (먼저 --dry-run 또는 --staging으로 설정을 확인한다. 실제 발급은 도메인당 주 5회 제한)
  # 갱신: 호스트 cron 주 1회 `docker compose --profile certbot run --rm certbot renew && docker compose exec nginx nginx -s reload`
  certbot:
    image: certbot/certbot:v4.1.1
    container_name: recipick-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    logging: *logging

networks:
  default:
    name: recipick
    external: true
