# HTTPS 단계. 인증서(recipick.shop, www.recipick.shop 두 이름을 한 인증서로)를 서버에서 발급한 뒤 머지한다.
# 배포 스크립트가 서버의 옛 app.conf를 지우고 nginx -t 후 reload한다. 인증서가 없으면 nginx -t가 실패해 이전 설정으로 돌아간다.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Host 헤더를 그대로 쓰지 않고 대표 주소로 보낸다. www는 한 번에 대표 주소로 간다
    location / {
        return 301 https://recipick.shop$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name recipick.shop;

    ssl_certificate /etc/letsencrypt/live/recipick.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipick.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 프론트 빌드 결과. deploy-web.sh가 current 링크를 바꾸면 reload 없이 다음 요청부터 새 파일을 준다
    root /srv/web/current;

    location /api/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://app;
    }

    # 빌드 파일명에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀐다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/에서 그대로 복사된 파일은 이름에 해시가 없어 짧게 둔다
    location ~ ^/(images|videos)/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 화면 경로(/cart 등)는 index.html이 받는다. 배포 직후 새 빌드를 가리키도록 index.html은 캐시하지 않는다.
    # 마지막 =404는 아직 프론트를 배포하지 않아 index.html이 없을 때 내부 재요청이 반복되는(500) 것을 막는다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html =404;
    }
}

# 쿠키·카카오 등록 주소를 하나로 맞추기 위해 www는 대표 주소로만 보낸다
server {
    listen 443 ssl;
    http2 on;
    server_name www.recipick.shop;

    ssl_certificate /etc/letsencrypt/live/recipick.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipick.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://recipick.shop$request_uri;
}
