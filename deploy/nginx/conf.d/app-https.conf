# HTTPS 단계. 인증서(recipick.shop, www.recipick.shop 두 이름을 한 인증서로)를 서버에서 발급한 뒤 머지한다.
# 배포 스크립트가 서버의 옛 app.conf를 지우고 nginx -t 후 reload한다. 인증서가 없으면 nginx -t가 실패해 이전 설정으로 돌아간다.

# Grafana 로그인 화면이 공개되어 있어 비밀번호 대입을 IP마다 늦춘다. 화면을 여는 GET도 같은 주소라 burst로 여유를 둔다
limit_req_zone $binary_remote_addr zone=grafana_login:1m rate=10r/m;
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Host 헤더를 그대로 쓰지 않고 대표 주소로 보낸다. www는 한 번에 대표 주소로 간다
    location / {
        return 301 https://recipick.shop$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name recipick.shop;

    ssl_certificate /etc/letsencrypt/live/recipick.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipick.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 프론트 빌드 결과. deploy-web.sh가 current 링크를 바꾸면 reload 없이 다음 요청부터 새 파일을 준다
    root /srv/web/current;

    # ^~: 아래 확장자 규칙보다 먼저 골라 /api/로 시작하면 경로 모양과 상관없이 앱으로 보낸다
    location ^~ /api/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://app;
    }

    # Grafana(compose.monitoring.yml). ^~: 아래 확장자 규칙이 Grafana의 JS·CSS 요청을 프론트 파일로 잡지 않게 먼저 고른다.
    # 주소를 변수에 담아 요청 때 이름을 찾는다. 이름을 직접 적으면 Grafana가 없을 때 nginx -t가 실패해 배포가 롤백된다.
    # Grafana가 꺼져 있으면 이 경로만 502다. 경로를 떼지 않고 넘긴다(Grafana가 하위 경로에서 응답)
    location ^~ /grafana/ {
        include /etc/nginx/proxy_params;
        set $grafana grafana:3000;
        proxy_pass http://$grafana;
    }

    location = /grafana/login {
        limit_req zone=grafana_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        set $grafana grafana:3000;
        proxy_pass http://$grafana;
    }

    # 끝 슬래시가 없으면 프론트 화면 규칙으로 가므로 Grafana 경로로 보낸다
    location = /grafana {
        return 301 /grafana/;
    }

    # 빌드 파일명에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀐다. ^~로 아래 확장자 규칙보다 먼저 고른다
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/에서 그대로 복사된 파일은 이름에 해시가 없어 짧게 둔다
    location ~ ^/(images|videos)/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 확장자가 있는 경로는 파일 요청이다. 없는 파일(/favicon.ico 등)에 index.html을 200으로 주지 않고 404
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # 직접 요청한 /index.html은 위 확장자 규칙보다 이 규칙이 먼저라 캐시하지 않는 설정을 유지한다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 화면 경로(/cart 등)는 index.html이 받는다. 배포 직후 새 빌드를 가리키도록 index.html은 캐시하지 않는다.
    # 마지막 =404는 아직 프론트를 배포하지 않아 index.html이 없을 때 내부 재요청이 반복되는(500) 것을 막는다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html =404;
    }
}

# 쿠키·카카오 등록 주소를 하나로 맞추기 위해 www는 대표 주소로만 보낸다
server {
    listen 443 ssl;
    http2 on;
    server_name www.recipick.shop;

    ssl_certificate /etc/letsencrypt/live/recipick.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipick.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://recipick.shop$request_uri;
}
