# HTTP 단계(도메인·인증서 발급 전). HTTPS 전환 시 이 파일을 app.conf.disabled로 바꾸고 app-https.conf.disabled를 켠다.
server {
    listen 80 default_server;
    server_name _;

    # certbot webroot 검증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://app;
    }
}
