# 모니터링(필수 11). 배포 스크립트는 이 파일을 다루지 않는다. 처음 기동과 설정 변경 반영은 서버에서 직접 한다(README 8절).
# 실행: docker compose -f compose.monitoring.yml up -d
# 호스트에 포트를 노출하지 않는다. Grafana만 nginx가 https://recipick.shop/grafana/ 로 내보내고(nginx/conf.d/app-https.conf),
# Prometheus는 인증이 없어 밖으로 열지 않는다.
# 메모리 예산: prometheus 384m + grafana 192m + exporter 3개 합계 약 128m. exporter는 아직 없다. 추가 후보:
#   node-exporter(호스트 CPU·메모리·디스크), mysqld-exporter(커넥션·락 대기·슬로 쿼리), redis-exporter(메모리·명령 수)
name: recipick-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: recipick-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # 기간보다 용량이 먼저 차면 오래된 블록부터 지운다. 루트 볼륨 30GB 보호
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    container_name: recipick-grafana
    restart: unless-stopped
    environment:
      # 로그인 화면이 인터넷에 열리므로 비밀번호 없이는 뜨지 않게 한다. 이 값은 첫 기동 때만 적용된다(이후 변경은 README 8절)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 비었다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # API의 Basic 인증은 nginx 로그인 제한(/grafana/login)을 거치지 않아 끈다. 화면 로그인만 쓴다
      GF_AUTH_BASIC_ENABLED: "false"
      # nginx가 /grafana/ 를 떼지 않고 그대로 넘기므로 Grafana가 하위 경로에서 직접 응답한다
      GF_SERVER_ROOT_URL: https://recipick.shop/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      # Grafana 자체 지표(/grafana/metrics)는 로그인 없이 열리는 기본값이라 끈다
      GF_METRICS_ENABLED: "false"
      # 실시간 연결(웹소켓)은 쓰지 않는다. 켜 두면 nginx에 업그레이드 설정이 없어 브라우저가 실패한 연결을 반복한다
      GF_LIVE_MAX_CONNECTIONS: "0"
    volumes:
      # 데이터소스·대시보드는 저장소 루트 monitoring/grafana/ 한 벌이다. CI가 배포 묶음에 이 경로로 담는다(ci.yml)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

networks:
  default:
    name: recipick
    external: true

volumes:
  prometheus-data:
  grafana-data:
