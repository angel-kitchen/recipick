# MySQL·Redis. 배포 때 재시작하지 않는다. 실행: docker compose -f compose.infra.yml up -d
# RDS·ElastiCache로 옮기면 이 파일을 지우고 .env의 접속 정보만 바꾼다. `down -v`는 데이터를 지우므로 쓰지 않는다.
name: recipick-infra

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: recipick-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 컨벤션의 팀 공통 락 대기 시간(5초). 앱의 세션 초기화 SQL과 같은 값
      - --innodb-lock-wait-timeout=5
      # 4GB 인스턴스에서 앱과 나눠 쓰는 크기
      - --innodb-buffer-pool-size=512M
      # 복제·시점 복구를 쓰지 않으므로 binlog를 끈다. 디스크와 쓰기 비용을 줄이고 백업은 mysqldump로 한다
      - --skip-log-bin
    # 호스트에 포트를 노출하지 않는다. 접근은 recipick 네트워크 안에서만
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  redis:
    image: redis:7.4
    container_name: recipick-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

networks:
  default:
    name: recipick
    external: true

volumes:
  mysql-data:
  redis-data:
