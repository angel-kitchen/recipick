# 태헌의 Actuator 설정(관리 포트·경로)에 맞춰 targets를 고친다. 앱과 같은 recipick 네트워크라 서비스 이름으로 접근한다.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: recipick-app
    metrics_path: /actuator/prometheus
    static_configs:
      # 관리 포트 분리 후의 값. 블루그린 도입 후에는 app-blue:8081, app-green:8081
      - targets: ["app:8081"]

  # 태헌이 exporter를 compose.monitoring.yml에 추가하면 주석을 푼다. 병목 분석에 앱 지표만으로는 부족하다
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  # - job_name: mysql
  #   static_configs:
  #     - targets: ["mysqld-exporter:9104"]
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
