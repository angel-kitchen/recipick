# 로컬 모니터링용 Prometheus·Grafana. 앱은 호스트(IntelliJ)에서 실행하고 관리 포트(8081)의 지표를 수집한다.
# 실행: docker compose -f docker-compose.monitoring.yml up -d
# Grafana: http://localhost:3000 (기본 계정 admin / 비밀번호는 GRAFANA_ADMIN_PASSWORD, 없으면 admin) - 로컬 전용
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: recipick-prometheus
    ports:
      # 내 컴퓨터에서만 접속하도록 127.0.0.1에 묶는다
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # 컨테이너에서 호스트에서 실행 중인 앱에 접근하기 위한 이름
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: recipick-grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
